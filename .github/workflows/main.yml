name: Build Extension

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Install Bolt CLI and build
        shell: bash
        run: |
          set -e
          curl -fsSL https://raw.githubusercontent.com/TechHamara/bolt-cli/main/scripts/install/install.sh | sh
          export PATH="$HOME/Bolt/bin:$HOME/Bolt:$PATH"
          echo "Checking Bolt CLI..."
          command -v bolt
          bolt --version
          echo "Building extension..."
          bolt build

      - name: Upload AIX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BoltWS-AIX
          path: out/*.aix
          if-no-files-found: error
